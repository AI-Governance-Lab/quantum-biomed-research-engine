replicaCount: 1

image:
  repository: docker.io/library/quantum-biomed-research-engine
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 8000
  targetPort: 8000
  nodePort: 30089

persistence:
  enabled: true
  storageClass: "local-path"
  accessMode: ReadWriteOnce
  size: 5Gi
  mountPath: /data

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

config:
  APP_NAME: "Quantum BioMed R&D Governance Engine"
  APP_VERSION: "1.0.0"
  APP_ENV: "production"
  API_BIND_HOST: "0.0.0.0"
  API_BIND_PORT: "8000"
  DATA_DIR: "/data"
  FDA_LEDGER_DB_PATH: "/data/fda_part11_audit_ledger.db"
  FINOPS_BUDGET_DB_PATH: "/data/clinical_study_finops.db"
  LLM_LIVE_MODE: "false"
  NIM_DIRECT_BASE_URL: ""
  NIM_DIRECT_MODEL: "deepseek-ai/deepseek-r1-distill-llama-8b"
  LITELLM_BASE_URL: "http://localhost:4001/v1"
  LITELLM_PRIMARY_MODEL: "gemini-3.8-flash"
  LITELLM_FALLBACK_MODELS: "glm-5.2,gemini-3.1-pro-preview,nvidia/nemotron-3-ultra-550b-a55b,codestral-2508"
  GXP_CONSENSUS_THRESHOLD: "0.95"
  DEFAULT_STUDY_GRANT_BUDGET_USD: "2500.00"
  K8S_NODEPORT: "30089"
  SIBLING_GQA_WORKBENCH_URL: "http://localhost:30088"
  SIBLING_PRIVATE_HUB_URL: "http://localhost:8080"

secrets:
  litellmApiKey: "replace_with_your_litellm_virtual_or_master_key"

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi
