    function VqeTrajectoryChart({ trajectory }) {
      if (!trajectory || trajectory.length < 2) return null;
      const minE = Math.min(...trajectory);
      const maxE = Math.max(...trajectory);
      const span = (maxE - minE) || 1;
      const width = 540, height = 165, padX = 44, padY = 24;
      const points = trajectory.map((val, idx) => {
        const x = padX + (idx / (trajectory.length - 1)) * (width - padX * 2);
        const y = height - padY - ((val - minE) / span) * (height - padY * 2);
        return `${x},${y}`;
      }).join(" ");

      return (
        <div className="glass-card rounded-xl p-4">
          <div className="flex items-center justify-between mb-2">
            <span className="text-xs font-semibold uppercase tracking-wider text-cyan-400">
              VQE Variational Ground-State Energy Trajectory (Hartrees)
            </span>
            <span className="text-xs font-mono text-emerald-400">
              E_0 = {minE} Ha
            </span>
          </div>
          <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-36 overflow-visible">
            <line x1={padX} y1={padY} x2={width - padX} y2={padY} stroke="#1e293b" strokeDasharray="4" />
            <line x1={padX} y1={height - padY} x2={width - padX} y2={height - padY} stroke="#334155" />
            <polyline fill="none" stroke="#06b6d4" strokeWidth="3" points={points} />
            {trajectory.map((val, idx) => {
              const x = padX + (idx / (trajectory.length - 1)) * (width - padX * 2);
              const y = height - padY - ((val - minE) / span) * (height - padY * 2);
              return (
                <g key={idx}>
                  <circle cx={x} cy={y} r="3.5" fill="#22d3ee" />
                  {(idx === 0 || idx === trajectory.length - 1) && (
                    <text x={x} y={y - 8} textAnchor="middle" fill="#cbd5e1" fontSize="10">{val.toFixed(3)}</text>
                  )}
                </g>
              );
            })}
          </svg>
        </div>
      );
    }

    function CollapsibleChatSection({ title, borderColor, titleColor, previewText, isOpen, onToggle, onFocusTrack, isFocusedTrack, children }) {
      const shortPreview = (previewText || "").replace(/\s+/g, " ").trim().slice(0, 120);

    function AssistantTurnBubble({ msg, idx, personaMode, onSelectContextTrack, askAssistantGuide, disabled }) {
      const effectiveMode = msg.locked_track || personaMode;
      const [openSections, setOpenSections] = useState({
        plain: effectiveMode === "plain",
        sci: effectiveMode === "scientist",
        steps: effectiveMode === "steps"
      });

      useEffect(() => {
        if (personaMode === "plain") setOpenSections({ plain: true, sci: false, steps: false });
        else if (personaMode === "scientist") setOpenSections({ plain: false, sci: true, steps: false });
        else if (personaMode === "steps") setOpenSections({ plain: false, sci: false, steps: true });
      }, [personaMode]);

      const toggleSec = (key) => {
        setOpenSections(prev => ({ ...prev, [key]: !prev[key] }));
      };

      const allOpen = openSections.plain && openSections.sci && openSections.steps;
      const toggleAll = () => {
        const nextState = !allOpen;
        setOpenSections({ plain: nextState, sci: nextState, steps: nextState });

                isFocusedTrack={personaMode === "scientist"}

              >
                <p className="text-xs text-slate-200 whitespace-pre-wrap leading-relaxed">
                  {msg.scientific_deep_dive}

    function PipelineFlowCard({ title, stages, job, accent = "cyan" }) {
      if (!job.running && !job.lastDuration) return null;
      const activeStageObj = stages.find(s => s.id === job.step) || stages[stages.length - 1];
      const pct = job.running
        ? Math.min(96, Math.round((job.step / stages.length) * 100))
        : 100;

      return (
        <div className="glass rounded-2xl p-4 border border-cyan-500/40 space-y-3 shadow-lg">
          <div className="flex flex-wrap items-center justify-between gap-2">
            <div className="flex items-center gap-2.5">
              {job.running ? (
                <span className="w-3 h-3 rounded-full bg-amber-400 animate-ping" />
              ) : (
                <span className="w-3 h-3 rounded-full bg-emerald-400" />

                  ? "bg-amber-500/20 border border-amber-400/50 text-amber-300"

                ⏱️ {job.running ? `Elapsed: ${job.elapsed}s` : `Completed in ${job.lastDuration}s`}

            <div
              className={`h-full transition-all duration-200 ${
                job.running
                  ? "bg-gradient-to-r from-cyan-400 via-indigo-400 to-emerald-400 animate-pulse"
                  : "bg-emerald-400"
              }`}
              style={{ width: `${pct}%` }}
            />
          </div>

          {job.running && activeStageObj && (
            <div className="text-xs font-mono text-cyan-300">
              ▶ Stage {job.step}/{stages.length}: <strong>{activeStageObj.title}</strong> — {activeStageObj.detail}...
            </div>
          )}

          <div className={`grid grid-cols-1 md:grid-cols-${stages.length} gap-2 pt-1`}>
            {stages.map(st => {
              const isDone = !job.running || st.id < job.step;
              const isCurrent = job.running && st.id === job.step;
              return (
                <div
                  key={st.id}
                  className={`p-2.5 rounded-xl border text-xs transition ${
                    isCurrent
                      ? "bg-cyan-500/20 border-cyan-400 text-white shadow-md shadow-cyan-500/10"
                      : isDone
                      ? "bg-emerald-500/10 border-emerald-500/30 text-emerald-200"

                  </div>

                </div>
              );
            })}

        </div>

                    disabled={chatJob.running || !chatQuestion.trim()}
                    className="px-5 py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-indigo-500 hover:from-cyan-400 hover:to-indigo-400 disabled:opacity-50 text-slate-950 font-bold text-xs transition shrink-0"
                  >
                    {chatJob.running ? `⏱️ ${chatJob.elapsed}s...` : "Send Turn ➢"}
                  </button>
                </div>
              </div>
            </div>
          )}
            </main>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
